name: KANJIDIC2 monthly check

# EDRDG Licence §4: data turunan KANJIDIC2 harus diperbarui rutin dari versi terbaru.
# Job ini hanya membandingkan snapshot di repo dengan berkas resmi EDRDG; gagal jika ada selisih.
on:
  schedule:
    - cron: "23 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare with official KANJIDIC2
        run: node scripts/kanjidic2-radical-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
