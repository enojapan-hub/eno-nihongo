name: ENO JAPAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Capture lint report
        run: bun run lint -- --format json --output-file eslint-report.json || true

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 1

      - name: Lint
        run: bun run lint -- --fix

      - name: Build
        run: bun run build