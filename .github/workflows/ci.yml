name: ENO JAPAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Capture lint report
        run: bun run lint -- --fix --format json --output-file eslint-report.json || true

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 1

      - name: Capture source snapshot
        run: zip -qr repo-source.zip src package.json tsconfig.json eslint.config.js

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repo-source
          path: repo-source.zip
          retention-days: 1

      - name: Generate current Supabase types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.ACCESS_TOKEN }}
          PROJECT_REF: upxtqsvgppvqpbrjoitz
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Live Supabase type freshness check skipped: SUPABASE_ACCESS_TOKEN is not configured for GitHub Actions."
            exit 0
          fi
          bunx supabase@latest gen types typescript --project-id "$PROJECT_REF" --schema public > generated-types.ts

      - name: Upload generated Supabase types
        if: ${{ hashFiles('generated-types.ts') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-supabase-types
          path: generated-types.ts
          retention-days: 1

      - name: Sync committed Supabase types
        if: ${{ hashFiles('generated-types.ts') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if ! cmp -s generated-types.ts src/integrations/supabase/types.ts; then
            cp generated-types.ts src/integrations/supabase/types.ts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/integrations/supabase/types.ts
            git commit -m "chore: sync Supabase generated types"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify committed Supabase types are current
        if: ${{ hashFiles('generated-types.ts') != '' }}
        run: |
          if ! cmp -s generated-types.ts src/integrations/supabase/types.ts; then
            echo "::error::src/integrations/supabase/types.ts is stale."
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
